<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Level Not Found | Juhair Islam Sami</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00ff41;
            --bg-dark: #0a0e27;
            --text-light: #e0e0e0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'VT323', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .container {
            border: 3px solid var(--primary-color);
            padding: 3rem;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 2rem;
            text-shadow: 0 0 20px var(--primary-color);
        }

        p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            padding: 1rem 2rem;
            border: 3px solid var(--primary-color);
            color: var(--bg-dark);
            background: var(--primary-color);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: transparent;
            color: var(--primary-color);
            box-shadow: 0 0 20px var(--primary-color);
        }

        .glitch-text {
            position: relative;
            display: inline-block;
        }

        .glitch-text::after {
            content: "404";
            position: absolute;
            left: 2px;
            text-shadow: -2px 0 #ff00ff;
            top: 0;
            color: var(--primary-color);
            background: var(--bg-dark);
            overflow: hidden;
            clip: rect(0, 900px, 0, 0);
            animation: noise-anim 2s infinite linear alternate-reverse;
        }

        @keyframes noise-anim {
            0% { clip: rect(61px, 9999px, 52px, 0); }
            5% { clip: rect(33px, 9999px, 144px, 0); }
            10% { clip: rect(121px, 9999px, 115px, 0); }
            15% { clip: rect(144px, 9999px, 48px, 0); }
            20% { clip: rect(135px, 9999px, 11px, 0); }
            /* ... clipped for brevity ... */
            100% { clip: rect(61px, 9999px, 52px, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="glitch-text">404</h1>
        <p>CRITICAL ERROR: LEVEL NOT FOUND</p>
        <p>The page you're looking for was deleted by a rogue process.</p>
        <a href="/" class="btn">REBOOT TO HOME</a>
    </div>
</body>
</html>
